name: Deploy relay + TURN

# Manually triggered. Provisions a fresh DigitalOcean droplet from
# infra/cloud-init.yaml (relay + coturn, plain), then from CI: upserts the
# Cloudflare DNS record to the droplet IP, issues a Let's Encrypt cert via
# DNS-01, and delivers it over SSH to enable coturn TLS.
#
# Immutable model: each run creates a NEW droplet. The Cloudflare token and the
# TLS private key never touch the droplet. Because of that there is no on-box
# cert renewal — the 90-day cert is refreshed by re-running this workflow.
# The old droplet is left running so a bad deploy can be rolled back by
# pointing DNS back at it; delete it manually after verifying.
on:
  workflow_dispatch:
    inputs:
      repo_ref:
        description: Git branch or tag to build the relay from
        required: true
        default: main
      region:
        description: DO region slug
        required: true
        default: ams3
      size:
        description: DO droplet size slug
        required: true
        default: s-1vcpu-2gb

permissions:
  contents: read

concurrency:
  group: deploy-relay-turn
  cancel-in-progress: false

env:
  # TURN realm = TLS cert domain = the FQDN the DNS record points at. Public
  # value in a repo variable, shared with release.yml so the client and server
  # agree on one source of truth.
  REALM: ${{ vars.TURN_REALM }}
  # Single droplet per repo — name is fixed, not an input.
  DROPLET_NAME: peerkit-video-chat-demo

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets and the TURN_REALM variable live in this Actions environment.
    environment: demo
    steps:
      - name: Check out
        # Pinned to a commit SHA (supply-chain); no token needed after checkout.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # Substitute placeholders in cloud-init. Untrusted/secret values reach the
      # script only through env vars and are applied with bash parameter
      # expansion (`${s//pat/rep}`), which substitutes literally — special
      # characters in the password can't break templating or inject shell.
      - name: Render cloud-init
        env:
          REPO_REF: ${{ inputs.repo_ref }}
          TURN_PASSWORD: ${{ secrets.TURN_PASSWORD }}
        run: |
          # bash 5.2+ treats `&` in a //-replacement as the matched text; turn
          # that off so the password substitutes literally.
          shopt -u patsub_replacement
          s=$(cat infra/cloud-init.yaml)
          s=${s//__REPO_REF__/$REPO_REF}
          s=${s//__REALM__/$REALM}
          s=${s//__TURN_PASSWORD__/$TURN_PASSWORD}
          printf '%s\n' "$s" > user-data.yaml
          # cloud-init's YAML loader rejects non-ASCII bytes (e.g. a stray
          # em-dash or an exotic password char) and silently drops the whole
          # config. Fail here instead, with a pointer to the offending byte.
          if LC_ALL=C grep -nP '[^\x00-\x7F]' user-data.yaml; then
            echo "::error::rendered user-data contains non-ASCII bytes; cloud-init would reject it"
            exit 1
          fi

      - name: Create droplet
        id: create
        env:
          NAME: ${{ env.DROPLET_NAME }}
          REGION: ${{ inputs.region }}
          SIZE: ${{ inputs.size }}
          # Comma-separated list of SSH key fingerprints (or IDs/names), one per
          # authorized operator. doctl --ssh-keys accepts the comma list as-is.
          SSH_KEYS: ${{ secrets.DO_SSH_KEY_FINGERPRINTS }}
          REPO_REF: ${{ inputs.repo_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Resolve the ref being deployed to a full commit SHA so the droplet
          # records exactly what it was built from.
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REPO_REF}" --jq '.sha')
          echo "deploying commit ${sha}"
          id=$(doctl compute droplet create "$NAME" \
            --image ubuntu-24-04-x64 \
            --region "$REGION" --size "$SIZE" \
            --ssh-keys "$SSH_KEYS" \
            --tag-names "peerkit,commit:${sha}" \
            --enable-monitoring \
            --user-data-file user-data.yaml \
            --wait --no-header --format ID)
          echo "droplet_id=$id" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$sha" >> "$GITHUB_OUTPUT"
          ip=$(doctl compute droplet get "$id" --no-header --format PublicIPv4)
          echo "droplet_ip=$ip" >> "$GITHUB_OUTPUT"

      # Issue the cert in CI via DNS-01 so the Cloudflare token stays off the
      # droplet. Custom dirs keep everything in the workspace (no root needed).
      # DNS-01 uses a TXT record, so it does not depend on the public A record —
      # the A cutover is deferred to the end, after TLS is confirmed working.
      - name: Issue TLS certificate (DNS-01)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          NAME: ${{ env.REALM }}
        run: |
          sudo apt-get update
          sudo apt-get install -y certbot python3-certbot-dns-cloudflare
          umask 077
          printf 'dns_cloudflare_api_token = %s\n' "$CF_TOKEN" > cf.ini
          certbot certonly --dns-cloudflare \
            --dns-cloudflare-credentials "$PWD/cf.ini" \
            --dns-cloudflare-propagation-seconds 30 \
            -d "$NAME" --non-interactive --agree-tos -m "$EMAIL" \
            --config-dir "$PWD/le" --work-dir "$PWD/le-work" --logs-dir "$PWD/le-logs"
          rm -f cf.ini

      # Wait for cloud-init to finish (coturn installed), copy the cert to a
      # turnserver-readable path, append the TLS listeners, restart coturn.
      - name: Deliver cert and enable TLS
        env:
          SSH_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          IP: ${{ steps.create.outputs.droplet_ip }}
          NAME: ${{ env.REALM }}
        run: |
          # Trailing newline is required — OpenSSH rejects a key file without
          # one ("error in libcrypto"). Validate it parses before using it.
          printf '%s\n' "$SSH_KEY" > key && chmod 600 key
          if ! ssh-keygen -y -f key >/dev/null 2>&1; then
            echo "::error::DO_SSH_PRIVATE_KEY is not a valid OpenSSH private key"
            exit 1
          fi
          ssh_opts="-i key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          remote() { ssh $ssh_opts "root@${IP}" "$@"; }
          # Block until first-boot provisioning has finished installing coturn.
          # Hard-fail (and dump diagnostics) if it errors or times out, rather
          # than masking it and racing a half-provisioned box.
          if ! timeout 900 ssh $ssh_opts "root@${IP}" 'cloud-init status --wait'; then
            remote 'cloud-init status --long; tail -n 100 /var/log/cloud-init-output.log' || true
            echo "::error::cloud-init did not finish cleanly on the droplet"
            exit 1
          fi
          remote 'install -d -o turnserver -g turnserver -m 0750 /etc/coturn/certs'
          scp $ssh_opts "le/live/${NAME}/fullchain.pem" "root@${IP}:/tmp/fullchain.pem"
          scp $ssh_opts "le/live/${NAME}/privkey.pem" "root@${IP}:/tmp/privkey.pem"
          remote 'install -o turnserver -g turnserver -m 0640 /tmp/fullchain.pem /etc/coturn/certs/fullchain.pem
                  install -o turnserver -g turnserver -m 0640 /tmp/privkey.pem /etc/coturn/certs/privkey.pem
                  rm -f /tmp/fullchain.pem /tmp/privkey.pem
                  grep -q "^tls-listening-port" /etc/turnserver.conf || printf "\ntls-listening-port=5349\nalt-tls-listening-port=443\ncert=/etc/coturn/certs/fullchain.pem\npkey=/etc/coturn/certs/privkey.pem\n" >> /etc/turnserver.conf
                  systemctl restart coturn'
          rm -f key

      # Cut DNS over only now that the new droplet serves TURN + working TLS.
      # DNS-only (grey cloud) A record — Cloudflare's proxy can't carry TURN UDP.
      - name: Upsert Cloudflare DNS record
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          NAME: ${{ env.REALM }}
          IP: ${{ steps.create.outputs.droplet_ip }}
        run: |
          api="https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records"
          rec_id=$(curl -fsS -H "Authorization: Bearer ${CF_TOKEN}" \
            "${api}?type=A&name=${NAME}" | jq -r '.result[0].id // empty')
          body=$(jq -nc --arg name "$NAME" --arg ip "$IP" \
            '{type:"A",name:$name,content:$ip,ttl:120,proxied:false}')
          if [ -n "$rec_id" ]; then
            curl -fsS -X PUT -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" -d "$body" "${api}/${rec_id}" >/dev/null
          else
            curl -fsS -X POST -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" -d "$body" "${api}" >/dev/null
          fi
          echo "A ${NAME} -> ${IP}"

      - name: Summary
        env:
          IP: ${{ steps.create.outputs.droplet_ip }}
          ID: ${{ steps.create.outputs.droplet_id }}
          SHA: ${{ steps.create.outputs.commit_sha }}
        run: |
          {
            echo "Deployed droplet **$ID** ($IP) from commit \`$SHA\`."
            echo "Tagged: \`peerkit\`, \`commit:$SHA\`. DO monitoring agent enabled."
            echo "DNS $REALM updated; coturn TLS enabled on 5349/443."
            echo ""
            echo "Old droplet (if any) was left running; delete it manually after verifying."
            echo "Cert is 90 days with no on-box renewal — re-run this workflow to refresh."
          } >> "$GITHUB_STEP_SUMMARY"
