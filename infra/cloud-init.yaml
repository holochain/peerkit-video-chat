#cloud-config
# One-shot provisioning for a DigitalOcean droplet running BOTH:
#   - the PeerKit relay (systemd unit: peerkit-relay)
#   - a coturn TURN/STUN server (systemd unit: coturn)
#
# This sets machine state ONCE at first boot. There is no day-2 config
# management — to change config, redeploy from an edited copy (the deploy
# workflow does the substitution). See infra/README.md.
#
# TLS is NOT handled here. coturn comes up plain (3478) at boot; the deploy
# workflow (.github/workflows/deploy.yml) issues a Let's Encrypt cert via
# DNS-01 in CI, delivers it over SSH, and enables the TLS listeners. This keeps
# the Cloudflare token off the droplet.
#
# The deploy workflow substitutes:
#   __REPO_REF__       git branch/tag to build the relay from
#   __REALM__          TURN realm (the server FQDN)
#   __TURN_PASSWORD__  static long-term TURN credential (from a GitHub secret)
# external-ip is filled automatically from DO metadata at boot.

packages:
  - git
  - curl
  - ca-certificates
  - build-essential
  - python3
  - coturn
  - ufw

write_files:
  # ---- relay: systemd unit (replaces apps/relay/ecosystem.config.cjs PM2 config) ----
  - path: /etc/systemd/system/peerkit-relay.service
    permissions: "0644"
    content: |
      [Unit]
      Description=PeerKit relay (rendezvous for peer discovery)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=peerkit
      Group=peerkit
      WorkingDirectory=/opt/peerkit-video-chat
      EnvironmentFile=/etc/peerkit-relay.env
      ExecStart=/usr/bin/node apps/relay/dist/index.js
      Restart=on-failure
      RestartSec=5
      # hardening
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      ProtectKernelTunables=true
      ProtectControlGroups=true
      RestrictSUIDSGID=true

      [Install]
      WantedBy=multi-user.target

  - path: /etc/peerkit-relay.env
    permissions: "0644"
    content: |
      RELAY_HOST=0.0.0.0
      RELAY_PORT=9000

  # ---- coturn: enable the packaged systemd service ----
  - path: /etc/default/coturn
    permissions: "0644"
    content: |
      TURNSERVER_ENABLED=1

  # ---- coturn: base config (plain STUN/TURN). The deploy workflow appends the
  #      TLS listener lines over SSH once it has delivered the cert. ----
  - path: /etc/turnserver.conf
    permissions: "0640"
    owner: root:turnserver
    content: |
      # STUN/TURN listeners
      listening-port=3478
      fingerprint

      # Static long-term credentials (single shared user)
      lt-cred-mech
      realm=__REALM__
      user=peerkit-video-chat-user:__TURN_PASSWORD__

      # Public IP — filled from DO metadata at boot
      external-ip=__EXTERNAL_IP__

      # Relay UDP port range — MUST match the firewall rule below
      min-port=49152
      max-port=65535

      # Abuse / SSRF protection: never relay to loopback, multicast, or private nets
      no-loopback-peers
      no-multicast-peers
      denied-peer-ip=0.0.0.0-0.255.255.255
      denied-peer-ip=10.0.0.0-10.255.255.255
      denied-peer-ip=100.64.0.0-100.127.255.255
      denied-peer-ip=169.254.0.0-169.254.255.255
      denied-peer-ip=172.16.0.0-172.31.255.255
      denied-peer-ip=192.168.0.0-192.168.255.255
      denied-peer-ip=::1
      denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

      # Rate / resource caps
      total-quota=100
      stale-nonce=600

      # No admin CLI surface
      no-cli

      # Logging
      log-file=/var/log/turnserver/turn.log
      simple-log

runcmd:
  # --- system user owning the relay checkout ---
  - useradd --system --create-home --home-dir /var/lib/peerkit --shell /usr/sbin/nologin peerkit

  # --- Node.js 24 (matches .nvmrc 24.15.0 / engines >=22) ---
  - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
  - apt-get install -y nodejs

  # --- build the relay from this repo ---
  # `npm install`, not `npm ci`: npm 11 omits cross-platform optional binaries
  # from the lock file, so `npm ci` refuses to proceed (see .github/workflows).
  - git clone --branch __REPO_REF__ --depth 1 https://github.com/holochain/peerkit-video-chat.git /opt/peerkit-video-chat
  - chown -R peerkit:peerkit /opt/peerkit-video-chat
  - cd /opt/peerkit-video-chat && sudo -u peerkit HOME=/var/lib/peerkit npm install --no-audit --no-fund
  - cd /opt/peerkit-video-chat && sudo -u peerkit HOME=/var/lib/peerkit npm run build

  # --- coturn external-ip from DO metadata + log dir ---
  # Fail the boot if the metadata lookup is empty — a blank external-ip makes
  # coturn advertise bad relay candidates. The deploy's `cloud-init status
  # --wait` then surfaces this as a hard failure.
  - |
    set -e
    EXTIP=$(curl -fsS --retry 3 --retry-delay 2 http://169.254.169.254/metadata/v1/interfaces/public/0/ipv4/address)
    if [ -z "$EXTIP" ]; then echo "metadata public IPv4 lookup returned empty" >&2; exit 1; fi
    sed -i "s|__EXTERNAL_IP__|${EXTIP}|" /etc/turnserver.conf
  - mkdir -p /var/log/turnserver && chown turnserver:turnserver /var/log/turnserver

  # --- firewall: SSH, relay, TURN, TLS, UDP relay range ---
  - ufw allow OpenSSH
  - ufw allow 9000/tcp
  - ufw allow 3478
  - ufw allow 5349
  - ufw allow 443/tcp
  - ufw allow 49152:65535/udp
  - ufw --force enable

  # --- start services (coturn plain; the deploy workflow adds TLS) ---
  - systemctl daemon-reload
  - systemctl enable --now coturn
  - systemctl enable --now peerkit-relay
