#cloud-config
# One-shot provisioning for a DigitalOcean droplet running BOTH:
#   - the PeerKit relay (systemd unit: peerkit-relay)
#   - a coturn TURN/STUN server (systemd unit: coturn) with Let's Encrypt TLS
#
# This sets machine state ONCE at first boot. There is no day-2 config
# management — to change config, redeploy from an edited copy of this file
# (the deploy workflow does the substitution). See infra/README.md.
#
# The deploy workflow (.github/workflows/deploy.yml) substitutes:
#   __REPO_REF__       git branch/tag to build the relay from
#   __REALM__          TURN realm AND TLS cert domain (the server FQDN)
#   __TURN_PASSWORD__   static long-term TURN credential (from a GitHub secret)
#   __CERTBOT_EMAIL__   contact email for Let's Encrypt (ACME account)
# external-ip is filled automatically from DO metadata at boot.
#
# PRECONDITION for TLS: __REALM__ must already resolve (DNS A record) to this
# droplet's public IP BEFORE boot — use a DO Reserved IP so the FQDN is stable
# across redeploys and reassign it to the new droplet as part of deploy.

packages:
  - git
  - curl
  - ca-certificates
  - build-essential
  - python3
  - coturn
  - certbot
  - ufw

write_files:
  # ---- relay: systemd unit (replaces apps/relay/ecosystem.config.cjs PM2 config) ----
  - path: /etc/systemd/system/peerkit-relay.service
    permissions: "0644"
    content: |
      [Unit]
      Description=PeerKit relay (rendezvous for peer discovery)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=peerkit
      Group=peerkit
      WorkingDirectory=/opt/peerkit-video-chat
      EnvironmentFile=/etc/peerkit-relay.env
      ExecStart=/usr/bin/node apps/relay/dist/index.js
      Restart=on-failure
      RestartSec=5
      # hardening
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      ProtectKernelTunables=true
      ProtectControlGroups=true
      RestrictSUIDSGID=true

      [Install]
      WantedBy=multi-user.target

  - path: /etc/peerkit-relay.env
    permissions: "0644"
    content: |
      RELAY_HOST=0.0.0.0
      RELAY_PORT=9000

  # ---- coturn: enable the packaged systemd service ----
  - path: /etc/default/coturn
    permissions: "0644"
    content: |
      TURNSERVER_ENABLED=1

  # ---- coturn: base config (plain STUN/TURN). TLS lines are appended at boot,
  #      only once the Let's Encrypt cert has been obtained. ----
  - path: /etc/turnserver.conf
    permissions: "0640"
    owner: root:turnserver
    content: |
      # STUN/TURN listeners
      listening-port=3478
      fingerprint

      # Static long-term credentials (single shared user)
      lt-cred-mech
      realm=__REALM__
      user=peerkit:__TURN_PASSWORD__

      # Public IP — filled from DO metadata at boot
      external-ip=__EXTERNAL_IP__

      # Relay UDP port range — MUST match the firewall rule below
      min-port=49152
      max-port=65535

      # Abuse / SSRF protection: never relay to loopback, multicast, or private nets
      no-loopback-peers
      no-multicast-peers
      denied-peer-ip=0.0.0.0-0.255.255.255
      denied-peer-ip=10.0.0.0-10.255.255.255
      denied-peer-ip=100.64.0.0-100.127.255.255
      denied-peer-ip=169.254.0.0-169.254.255.255
      denied-peer-ip=172.16.0.0-172.31.255.255
      denied-peer-ip=192.168.0.0-192.168.255.255
      denied-peer-ip=::1
      denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

      # Rate / resource caps
      total-quota=100
      stale-nonce=600

      # No admin CLI surface
      no-cli

      # Logging
      log-file=/var/log/turnserver/turn.log
      simple-log

  # ---- coturn: certbot deploy hook — copy renewed certs where turnserver can
  #      read them (the live/ dir is root-only) and restart coturn ----
  - path: /etc/letsencrypt/renewal-hooks/deploy/coturn.sh
    permissions: "0755"
    content: |
      #!/bin/sh
      set -e
      DOMAIN="__REALM__"
      SRC="/etc/letsencrypt/live/${DOMAIN}"
      DST="/etc/coturn/certs"
      install -d -o turnserver -g turnserver -m 0750 "$DST"
      install -o turnserver -g turnserver -m 0640 "$SRC/fullchain.pem" "$DST/fullchain.pem"
      install -o turnserver -g turnserver -m 0640 "$SRC/privkey.pem" "$DST/privkey.pem"
      systemctl restart coturn

runcmd:
  # --- system user owning the relay checkout ---
  - useradd --system --create-home --home-dir /var/lib/peerkit --shell /usr/sbin/nologin peerkit

  # --- Node.js 24 (matches .nvmrc 24.15.0 / engines >=22) ---
  - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
  - apt-get install -y nodejs

  # --- build the relay from this repo ---
  # `npm install`, not `npm ci`: npm 11 omits cross-platform optional binaries
  # from the lock file, so `npm ci` refuses to proceed (see .github/workflows).
  - git clone --branch __REPO_REF__ --depth 1 https://github.com/holochain/peerkit-video-chat.git /opt/peerkit-video-chat
  - chown -R peerkit:peerkit /opt/peerkit-video-chat
  - cd /opt/peerkit-video-chat && sudo -u peerkit HOME=/var/lib/peerkit npm install --no-audit --no-fund
  - cd /opt/peerkit-video-chat && sudo -u peerkit HOME=/var/lib/peerkit npm run build

  # --- coturn external-ip from DO metadata + log dir ---
  - EXTIP=$(curl -s http://169.254.169.254/metadata/v1/interfaces/public/0/ipv4/address); sed -i "s/__EXTERNAL_IP__/${EXTIP}/" /etc/turnserver.conf
  - mkdir -p /var/log/turnserver && chown turnserver:turnserver /var/log/turnserver

  # --- firewall: SSH, relay, TURN, TLS, HTTP-01 challenge, UDP relay range ---
  - ufw allow OpenSSH
  - ufw allow 9000/tcp
  - ufw allow 3478
  - ufw allow 5349
  - ufw allow 443/tcp
  - ufw allow 80/tcp
  - ufw allow 49152:65535/udp
  - ufw --force enable

  # --- Let's Encrypt cert (HTTP-01 standalone on :80). Requires __REALM__ DNS
  #     to already point here. On success, enable TLS listeners on 5349 + 443.
  #     On failure (e.g. DNS not yet propagated) plain 3478 still works. ---
  - |
    if certbot certonly --standalone --non-interactive --agree-tos \
        -m "__CERTBOT_EMAIL__" -d "__REALM__"; then
      printf '\n# TLS listeners (added after cert issuance)\ntls-listening-port=5349\nalt-tls-listening-port=443\ncert=/etc/coturn/certs/fullchain.pem\npkey=/etc/coturn/certs/privkey.pem\n' >> /etc/turnserver.conf
      /etc/letsencrypt/renewal-hooks/deploy/coturn.sh
    else
      echo "certbot failed — coturn will serve plain STUN/TURN on 3478 only" >&2
    fi

  # --- start services ---
  - systemctl daemon-reload
  - systemctl enable --now coturn
  - systemctl enable --now peerkit-relay
